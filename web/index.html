<!DOCTYPE html>
<html>
<head>
  <!--
    Force an immediate check for a newer Service Worker on every load, and
    reload once automatically when a new one takes control. This runs before
    flutter_bootstrap.js registers its own worker, so users who are stuck on
    an old cached build get migrated to the latest version (via the
    self-unregistering flutter_service_worker.js) without having to manually
    clear site data.
  -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        registrations.forEach((registration) => registration.update());
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!sessionStorage.getItem('swUpdateReload')) {
          sessionStorage.setItem('swUpdateReload', '1');
          window.location.reload();
        }
      });
    }
  </script>
